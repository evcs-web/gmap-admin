<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMAP Pulse — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#FBF8F2; --surface:#FFFFFF; --ink:#26332C; --muted:#6B7A72;
    --accent:#3E7C6F; --accent-dark:#2C5C52; --warm:#EFA13B; --warm-soft:#FCEBD1;
    --line:#E7E1D3; --sky:#DCEAE5; --danger:#C1583F;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Karla',sans-serif; }
  .hidden{ display:none !important; }

  #adminView{ padding:28px 20px 60px; }
  .wrap{ max-width:960px; margin:0 auto; }
  .header{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .admin-title{ font-family:'Fredoka', sans-serif; font-weight:600; font-size:1.9rem; margin:0 0 6px; color:var(--ink); }
  .subtitle{ color:var(--muted); font-size:.95rem; margin:0; }
  .refresh-btn{
    background:var(--surface); border:1.5px solid var(--line); color:var(--ink); font-family:'Karla',sans-serif;
    font-weight:700; font-size:.88rem; padding:10px 16px; border-radius:12px; cursor:pointer;
    display:flex; align-items:center; gap:8px; transition:border-color .15s ease, transform .1s ease;
  }
  .refresh-btn:hover{ border-color:var(--accent); }
  .refresh-btn:active{ transform:scale(.97); }
  .refresh-btn.spinning .spin-icon{ animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .filter-bar select{
    font-family:'Karla',sans-serif; font-size:.88rem; padding:9px 14px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;
  }
  .filter-bar select:focus{ outline:none; border-color:var(--accent); }
  .unmatched-note{ font-size:.78rem; color:var(--muted); margin:0 0 18px; }

  .pulse-hero{
    background:var(--accent); color:#fff; border-radius:24px; padding:28px 30px; margin-bottom:22px;
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .pulse-left{ display:flex; align-items:center; gap:18px; }
  .pulse-emoji{ font-size:2.6rem; line-height:1; }
  .pulse-number{ font-family:'Fredoka',sans-serif; font-size:2.4rem; font-weight:600; line-height:1; }
  .pulse-label{ font-size:.85rem; opacity:.85; margin-top:4px; }
  .pulse-right{ text-align:right; }
  .response-count{ font-family:'Fredoka',sans-serif; font-size:1.5rem; font-weight:600; }
  .response-target{ font-size:.82rem; opacity:.85; }
  .target-track{ width:180px; height:6px; border-radius:999px; background:rgba(255,255,255,.3); margin-top:8px; overflow:hidden; }
  .target-fill{ height:100%; background:#fff; border-radius:999px; transition:width .5s ease; }

  .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:18px; }
  @media (max-width:760px){ .grid-3{ grid-template-columns:1fr; } }

  .admin-card{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:22px; margin-bottom:18px; }
  .metric-card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; }
  .card-title{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.1rem; margin:0 0 4px; }
  .card-sub{ color:var(--muted); font-size:.85rem; margin:0 0 14px; }

  .avg-row{ display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .avg-number{ font-family:'Fredoka',sans-serif; font-size:1.9rem; font-weight:600; color:var(--accent); }
  .avg-out-of{ color:var(--muted); font-size:.8rem; }
  .delta-row{ display:flex; align-items:center; gap:5px; font-size:.8rem; font-weight:700; margin-bottom:10px; }
  .delta-up{ color:var(--accent); }
  .delta-down{ color:var(--danger); }
  .delta-flat{ color:var(--muted); }
  .sparkline-wrap{ position:relative; width:100%; height:44px; }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-emoji{ width:26px; text-align:center; font-size:1.1rem; flex-shrink:0; }
  .bar-label{ width:150px; flex-shrink:0; font-size:.85rem; color:var(--ink); font-weight:600; }
  .bar-track{ flex:1; height:12px; border-radius:999px; background:var(--sky); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; background:var(--accent); transition:width .5s ease; }
  .bar-count{ width:64px; text-align:right; flex-shrink:0; font-size:.8rem; color:var(--muted); font-weight:600; }

  .highlights-list{ display:flex; flex-direction:column; gap:12px; max-height:520px; overflow-y:auto; }
  .highlight-card{ background:var(--warm-soft); border-radius:14px; padding:14px 16px; font-size:.92rem; line-height:1.5; color:var(--ink); }
  .highlight-meta{ display:block; margin-top:8px; font-size:.75rem; color:var(--muted); font-weight:600; }
  .empty-state{ color:var(--muted); font-size:.9rem; padding:20px 4px; text-align:center; }
  .loading{ text-align:center; padding:60px 0; color:var(--muted); }
  .error-banner{ background:#FBE8E2; color:#9B3A22; border-radius:14px; padding:14px 18px; font-size:.88rem; margin-bottom:18px; }

  .trend-legend{ display:flex; flex-wrap:wrap; gap:16px; margin-bottom:14px; font-size:.8rem; color:var(--muted); }
  .trend-legend span{ display:flex; align-items:center; gap:6px; }
  .trend-legend .dot{ width:10px; height:10px; border-radius:2px; display:inline-block; }

  .trend-table{ width:100%; border-collapse:collapse; font-size:.82rem; margin-top:18px; }
  .trend-table th, .trend-table td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  .trend-table th{ color:var(--muted); font-weight:700; font-size:.75rem; text-transform:uppercase; letter-spacing:.02em; }
  .trend-table td.num{ text-align:right; font-weight:600; }
</style>
</head>
<body>

<div id="adminView">
  <div class="wrap">
    <div class="header">
      <div>
        <h1 class="admin-title">GMAP Pulse — Insights</h1>
        <p class="subtitle">Live results from your team's check-in survey.</p>
        <p class="subtitle" style="font-size:.8rem; opacity:.75;">Snapshot data — refreshed periodically, not real-time.</p>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="refresh-btn" id="exportBtn" onclick="exportExcel()">
          <span>⬇️</span> Export Excel
        </button>
        <button class="refresh-btn" id="refreshBtn" onclick="loadAdminData()">
          <span class="spin-icon">🔄</span> Refresh
        </button>
      </div>
    </div>

    <div class="filter-bar">
      <select id="cohortFilter" onchange="onFilterChange()"><option value="all">All cohorts</option></select>
      <select id="hrbpFilter" onchange="onFilterChange()"><option value="all">All HRBPs</option></select>
      <button class="refresh-btn" onclick="resetFilters()">Reset filters</button>
    </div>
    <p class="unmatched-note" id="unmatchedNote"></p>

    <div id="errorBanner"></div>
    <div id="adminContent">
      <div class="loading">Loading responses...</div>
    </div>
  </div>
</div>

<script>
  /* ==================== CONFIG ==================== */
  const CSV_URL = './data.csv';
  const ROSTER_URL = './roster.csv';

  const rotationLabels = { 1:'1: Struggling', 2:'2: Surviving', 3:'3: Maintaining', 4:'4: Progressing', 5:'5: Thriving' };
  const workloadLabels = { 1:'1: Overwhelmed', 2:'2: Heavy', 3:'3: Manageable', 4:'4: Comfortable', 5:'5: Very light' };
  const supportedLabels = { 1:'1: Unsupported', 2:'2: Somewhat unsupported', 3:'3: Neutral', 4:'4: Mostly supported', 5:'5: Fully supported' };
  const rotationEmojiMap = {1:'😖',2:'😕',3:'😐',4:'🙂',5:'😄'};
  const workloadEmojiMap = {1:'🥵',2:'😣',3:'😌',4:'🙂',5:'😎'};
  const supportedEmojiMap = {1:'😞',2:'😕',3:'😐',4:'🙂',5:'🤝'};
  const TARGET = 30;

  let allResponses = [];
  let rosterIndex = { byEmail:{}, cohorts:[], hrbps:[] };
  let lastResponses = [];
  let mainTrendChart = null;
  let sparklineCharts = { rotation:null, workload:null, supported:null };

  function scoreFromLabel(v){
    if(v === undefined || v === null) return NaN;
    const n = parseInt(String(v).trim(), 10);
    return isNaN(n) ? NaN : n;
  }

  function rowsToResponses(rows){
    if(!rows || rows.length < 2) return [];
    const headers = rows[0].map(h => (h || '').trim());
    const idx = (name) => headers.indexOf(name);

    const iTs = idx('Timestamp');
    const iEmail = idx('Email');
    const iRotation = idx('How are you feeling about your rotation this week?');
    const iWorkload = idx('How manageable has your workload felt this week?');
    const iSupported = idx('How supported have you felt by your Reporting Manager/team this week?');
    const iHighlight = idx('Is there anything you\u2019d like to flag to us this week?');
    const iId = idx('id (internal \u2014 do not use)');
    const iWeek = idx('week (internal)');

    return rows.slice(1)
      .filter(r => r.length > 0 && (iEmail === -1 || r[iEmail]))
      .map(r => ({
        id: iId > -1 ? r[iId] || '' : '',
        ts: iTs > -1 ? r[iTs] || '' : '',
        week: iWeek > -1 ? r[iWeek] || '' : '',
        email: iEmail > -1 ? (r[iEmail] || '').trim() : '',
        rotation: scoreFromLabel(iRotation > -1 ? r[iRotation] : ''),
        workload: scoreFromLabel(iWorkload > -1 ? r[iWorkload] : ''),
        supported: scoreFromLabel(iSupported > -1 ? r[iSupported] : ''),
        highlight: iHighlight > -1 ? r[iHighlight] || '' : ''
      }));
  }

  function buildRosterIndex(rows){
    if(!rows || rows.length < 2) return { byEmail:{}, cohorts:[], hrbps:[] };
    const headers = rows[0].map(h => (h || '').trim());
    const idx = (name) => headers.indexOf(name);
    const iCohort = idx('GMAP Cohort');
    const iName = idx('Name');
    const iEmail = idx('Email');
    const iHrbp = idx('HRBP');

    const byEmail = {};
    const cohortSet = new Set();
    const hrbpSet = new Set();

    rows.slice(1).forEach(r => {
      if(!r.length || iEmail === -1 || !r[iEmail]) return;
      const key = r[iEmail].trim().toLowerCase();
      const cohort = iCohort > -1 ? (r[iCohort] || '').trim() : '';
      const hrbp = iHrbp > -1 ? (r[iHrbp] || '').trim() : '';
      const name = iName > -1 ? (r[iName] || '').trim() : '';
      byEmail[key] = { cohort, hrbp, name };
      if(cohort) cohortSet.add(cohort);
      if(hrbp) hrbpSet.add(hrbp);
    });

    return {
      byEmail,
      cohorts: Array.from(cohortSet).sort(),
      hrbps: Array.from(hrbpSet).sort()
    };
  }

  function joinWithRoster(responses, index){
    return responses.map(r => {
      const key = (r.email || '').trim().toLowerCase();
      const match = index.byEmail[key];
      return {
        ...r,
        cohort: match ? match.cohort : null,
        hrbp: match ? match.hrbp : null,
        maName: match ? match.name : null,
        unmatched: !match
      };
    });
  }

  function populateFilterOptions(index){
    const cohortSel = document.getElementById('cohortFilter');
    const hrbpSel = document.getElementById('hrbpFilter');
    cohortSel.innerHTML = '<option value="all">All cohorts</option>' +
      index.cohorts.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    hrbpSel.innerHTML = '<option value="all">All HRBPs</option>' +
      index.hrbps.map(h => `<option value="${escapeHtml(h)}">${escapeHtml(h)}</option>`).join('');
  }

  function getFilteredResponses(){
    const cohort = document.getElementById('cohortFilter').value;
    const hrbp = document.getElementById('hrbpFilter').value;
    if(cohort === 'all' && hrbp === 'all') return allResponses;
    return allResponses.filter(r => {
      if(r.unmatched) return false;
      if(cohort !== 'all' && r.cohort !== cohort) return false;
      if(hrbp !== 'all' && r.hrbp !== hrbp) return false;
      return true;
    });
  }

  function onFilterChange(){
    lastResponses = getFilteredResponses();
    renderAdmin(lastResponses);
  }

  function resetFilters(){
    document.getElementById('cohortFilter').value = 'all';
    document.getElementById('hrbpFilter').value = 'all';
    onFilterChange();
  }

  function loadAdminData(){
    const btn = document.getElementById('refreshBtn');
    const errorBanner = document.getElementById('errorBanner');
    errorBanner.innerHTML = '';
    if(btn){ btn.classList.add('spinning'); btn.disabled = true; }

    const parseCsv = (url) => new Promise((resolve, reject) => {
      Papa.parse(url, { download: true, complete: (res) => resolve(res.data || []), error: reject });
    });

    Promise.all([parseCsv(CSV_URL), parseCsv(ROSTER_URL)])
      .then(([dataRows, rosterRows]) => {
        rosterIndex = buildRosterIndex(rosterRows);
        const responses = rowsToResponses(dataRows);
        allResponses = joinWithRoster(responses, rosterIndex);
        populateFilterOptions(rosterIndex);

        const unmatchedCount = allResponses.filter(r => r.unmatched).length;
        const note = document.getElementById('unmatchedNote');
        note.textContent = unmatchedCount > 0
          ? `${unmatchedCount} response${unmatchedCount === 1 ? '' : 's'} couldn't be matched to the roster (check for email typos).`
          : '';

        lastResponses = getFilteredResponses();
        renderAdmin(lastResponses);
      })
      .catch((err) => {
        console.error('Load error:', err);
        allResponses = [];
        lastResponses = [];
        errorBanner.innerHTML = `<div class="error-banner">Couldn't load responses — check that data.csv and roster.csv exist and are correctly formatted.</div>`;
        document.getElementById('adminContent').innerHTML = '';
      })
      .finally(() => {
        if(btn){ btn.classList.remove('spinning'); btn.disabled = false; }
      });
  }

  window.onload = loadAdminData;

  /* ==================== SHARED HELPERS ==================== */
  function avg(nums){ if(!nums.length) return 0; return nums.reduce((a,b)=>a+b,0) / nums.length; }
  function pulseEmojiFor(score){
    if(score >= 4.3) return '🤩'; if(score >= 3.5) return '🙂';
    if(score >= 2.5) return '😐'; if(score >= 1.5) return '😕'; return '😖';
  }
  function renderDistBar(containerEl, count, total, labelText, emoji){
    const pct = total > 0 ? Math.round((count/total)*100) : 0;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      ${emoji ? `<span class="bar-emoji">${emoji}</span>` : ''}
      <span class="bar-label">${labelText}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
      <span class="bar-count">${count} \u00b7 ${pct}%</span>
    `;
    containerEl.appendChild(row);
  }
  function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str == null ? '' : str; return d.innerHTML; }

  // Monday of a given ISO week label like "2026-W37"
  function isoWeekToMonday(weekLabel){
    const m = /^(\d{4})-W(\d{1,2})$/.exec(weekLabel || '');
    if(!m) return null;
    const year = parseInt(m[1], 10), wk = parseInt(m[2], 10);
    const jan4 = new Date(Date.UTC(year, 0, 4));
    const jan4Day = jan4.getUTCDay() || 7;
    const week1Monday = new Date(jan4);
    week1Monday.setUTCDate(jan4.getUTCDate() - jan4Day + 1);
    const monday = new Date(week1Monday);
    monday.setUTCDate(week1Monday.getUTCDate() + (wk - 1) * 7);
    return monday;
  }

  function computeWeeklyBuckets(responses){
    const byWeek = {};
    responses.forEach(r => {
      const wk = r.week || 'Unlabeled';
      if(!byWeek[wk]) byWeek[wk] = { rotation:[], workload:[], supported:[], count:0 };
      if(typeof r.rotation === 'number' && !isNaN(r.rotation)) byWeek[wk].rotation.push(r.rotation);
      if(typeof r.workload === 'number' && !isNaN(r.workload)) byWeek[wk].workload.push(r.workload);
      if(typeof r.supported === 'number' && !isNaN(r.supported)) byWeek[wk].supported.push(r.supported);
      byWeek[wk].count++;
    });
    const weekKeys = Object.keys(byWeek).sort();
    return weekKeys.map(wk => {
      const b = byWeek[wk];
      const monday = isoWeekToMonday(wk);
      const label = monday
        ? 'Week of ' + monday.toLocaleDateString(undefined, { month:'short', day:'numeric' })
        : wk;
      return {
        week: wk, label,
        rotation: avg(b.rotation), workload: avg(b.workload), supported: avg(b.supported),
        count: b.count
      };
    });
  }

  function deltaHtml(current, previous, unit){
    if(previous === undefined || previous === null || isNaN(previous)){
      return `<span class="delta-flat">\u2014</span>`;
    }
    const d = current - previous;
    const rounded = Math.round(d * 10) / 10;
    if(Math.abs(rounded) < 0.05){
      return `<span class="delta-flat">0.0 ${unit}</span>`;
    }
    const cls = rounded > 0 ? 'delta-up' : 'delta-down';
    const sign = rounded > 0 ? '+' : '';
    const arrow = rounded > 0 ? '\u2191' : '\u2193';
    return `<span class="${cls}">${arrow} ${sign}${rounded.toFixed(1)} ${unit}</span>`;
  }

  function renderSparkline(canvasId, chartRefKey, values, color){
    const ctx = document.getElementById(canvasId);
    if(!ctx) return;
    if(sparklineCharts[chartRefKey]) sparklineCharts[chartRefKey].destroy();
    sparklineCharts[chartRefKey] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: values.map((_, i) => i),
        datasets: [{ data: values, borderColor: color, borderWidth: 2, pointRadius: 0, tension: 0.35, fill: false }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { x: { display:false }, y: { display:false, min:1, max:5 } },
        plugins: { legend: { display:false }, tooltip: { enabled:false } }
      }
    });
  }

  function renderTrendChart(buckets){
    const ctx = document.getElementById('trendChart');
    if(!ctx) return;
    if(mainTrendChart) mainTrendChart.destroy();
    if(buckets.length === 0) return;

    const maxCount = Math.max(1, ...buckets.map(b => b.count));

    mainTrendChart = new Chart(ctx, {
      data: {
        labels: buckets.map(b => b.label),
        datasets: [
          {
            type: 'bar', label: 'Responses', data: buckets.map(b => b.count),
            backgroundColor: '#DCEAE5', yAxisID: 'yCount', order: 3,
            borderRadius: 4, maxBarThickness: 36
          },
          {
            type: 'line', label: 'Rotation', data: buckets.map(b => b.rotation),
            borderColor: '#2a78d6', backgroundColor: '#2a78d6', yAxisID: 'y',
            pointRadius: 4, pointBorderColor: '#FBF8F2', pointBorderWidth: 2, borderWidth: 2, tension: 0.3, order: 1
          },
          {
            type: 'line', label: 'Workload', data: buckets.map(b => b.workload),
            borderColor: '#eb6834', backgroundColor: '#eb6834', yAxisID: 'y',
            pointRadius: 4, pointBorderColor: '#FBF8F2', pointBorderWidth: 2, borderWidth: 2, tension: 0.3, borderDash: [6,3], order: 1
          },
          {
            type: 'line', label: 'Supported', data: buckets.map(b => b.supported),
            borderColor: '#1baf7a', backgroundColor: '#1baf7a', yAxisID: 'y',
            pointRadius: 4, pointBorderColor: '#FBF8F2', pointBorderWidth: 2, borderWidth: 2, tension: 0.3, borderDash: [2,3], order: 1
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (item) => item.dataset.label === 'Responses'
                ? `${item.formattedValue} response${item.raw === 1 ? '' : 's'}`
                : `${item.dataset.label}: ${item.formattedValue}`
            }
          }
        },
        scales: {
          y: { min:1, max:5, grid: { color:'#E7E1D3' }, ticks: { color:'#6B7A72' } },
          yCount: { min:0, max: maxCount * 3, display:false },
          x: { grid: { display:false }, ticks: { color:'#6B7A72' } }
        }
      }
    });
  }

  function renderTrendTable(buckets){
    if(buckets.length === 0) return '<div class="empty-state">No data yet.</div>';
    const rows = buckets.map(b => `
      <tr>
        <td>${escapeHtml(b.label)}</td>
        <td class="num">${b.rotation ? b.rotation.toFixed(1) : '\u2013'}</td>
        <td class="num">${b.workload ? b.workload.toFixed(1) : '\u2013'}</td>
        <td class="num">${b.supported ? b.supported.toFixed(1) : '\u2013'}</td>
        <td class="num">${b.count}</td>
      </tr>
    `).join('');
    return `
      <table class="trend-table">
        <thead><tr><th>Week</th><th>Rotation</th><th>Workload</th><th>Supported</th><th>Responses</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  /* ==================== MAIN RENDER ==================== */
  function renderAdmin(responses){
    const content = document.getElementById('adminContent');
    const total = responses.length;

    if(total === 0){
      content.innerHTML = `<div class="admin-card"><div class="empty-state">No responses match this filter yet.</div></div>`;
      return;
    }

    const rotationVals = responses.map(r => r.rotation).filter(v => typeof v === 'number' && !isNaN(v));
    const workloadVals = responses.map(r => r.workload).filter(v => typeof v === 'number' && !isNaN(v));
    const supportedVals = responses.map(r => r.supported).filter(v => typeof v === 'number' && !isNaN(v));
    const rotationAvg = avg(rotationVals);
    const workloadAvg = avg(workloadVals);
    const supportedAvg = avg(supportedVals);
    const overallAvg = avg([rotationAvg, workloadAvg, supportedAvg]);

    const buckets = computeWeeklyBuckets(responses);
    const current = buckets[buckets.length - 1];
    const previous = buckets.length > 1 ? buckets[buckets.length - 2] : null;

    const highlights = responses
      .filter(r => r.highlight && r.highlight.trim().length > 0)
      .sort((a,b) => new Date(b.ts) - new Date(a.ts));

    const targetPct = Math.min(100, Math.round((total/TARGET)*100));

    content.innerHTML = `
      <div class="pulse-hero">
        <div class="pulse-left">
          <div>
            <div class="pulse-number">${overallAvg.toFixed(1)} / 5</div>
            <div class="pulse-label">Overall team pulse (rotation + workload + supported) \u00b7 ${pulseEmojiFor(overallAvg)}</div>
          </div>
        </div>
        <div class="pulse-right">
          <div class="response-count">${total}</div>
          <div class="response-target">of ${TARGET} expected responses</div>
          <div class="target-track"><div class="target-fill" style="width:${targetPct}%"></div></div>
        </div>
      </div>

      <div class="grid-3">
        <div class="metric-card">
          <div class="card-title" style="font-size:.95rem;">Rotation</div>
          <div class="avg-row"><span class="avg-number">${rotationAvg.toFixed(1)}</span><span class="avg-out-of">/5</span></div>
          <div class="delta-row">${current ? deltaHtml(current.rotation, previous ? previous.rotation : null, 'pts') : ''}</div>
          <div class="sparkline-wrap"><canvas id="sparkRotation"></canvas></div>
        </div>
        <div class="metric-card">
          <div class="card-title" style="font-size:.95rem;">Workload</div>
          <div class="avg-row"><span class="avg-number">${workloadAvg.toFixed(1)}</span><span class="avg-out-of">/5</span></div>
          <div class="delta-row">${current ? deltaHtml(current.workload, previous ? previous.workload : null, 'pts') : ''}</div>
          <div class="sparkline-wrap"><canvas id="sparkWorkload"></canvas></div>
        </div>
        <div class="metric-card">
          <div class="card-title" style="font-size:.95rem;">Supported</div>
          <div class="avg-row"><span class="avg-number">${supportedAvg.toFixed(1)}</span><span class="avg-out-of">/5</span></div>
          <div class="delta-row">${current ? deltaHtml(current.supported, previous ? previous.supported : null, 'pts') : ''}</div>
          <div class="sparkline-wrap"><canvas id="sparkSupported"></canvas></div>
        </div>
      </div>

      <div class="admin-card">
        <div class="card-title">Rotation feeling</div>
        <div class="card-sub">Struggling (1) \u2192 Thriving (5)</div>
        <div id="rotationDist"></div>
      </div>
      <div class="admin-card">
        <div class="card-title">Workload manageability</div>
        <div class="card-sub">Overwhelmed (1) \u2192 Very light (5)</div>
        <div id="workloadDist"></div>
      </div>
      <div class="admin-card">
        <div class="card-title">Supported by RM/team</div>
        <div class="card-sub">Unsupported (1) \u2192 Fully supported (5)</div>
        <div id="supportedDist"></div>
      </div>

      <div class="admin-card">
        <div class="card-title">Trend over time</div>
        <div class="card-sub">Weekly averages, with response volume as context</div>
        <div class="trend-legend">
          <span><span class="dot" style="background:#2a78d6"></span>Rotation</span>
          <span><span class="dot" style="background:#eb6834"></span>Workload</span>
          <span><span class="dot" style="background:#1baf7a"></span>Supported</span>
          <span><span class="dot" style="background:#DCEAE5"></span>Responses (volume)</span>
        </div>
        <div style="position:relative; width:100%; height:280px;">
          <canvas id="trendChart" role="img" aria-label="Line chart of weekly averages for rotation, workload, and supported, with response counts as background bars"></canvas>
        </div>
        ${renderTrendTable(buckets)}
      </div>

      <div class="admin-card">
        <div class="card-title">Highlights from the team</div>
        <div class="card-sub">${highlights.length} of ${total} people left a note, most recent first</div>
        <div class="highlights-list" id="highlightsList"></div>
      </div>
    `;

    const rotDist = document.getElementById('rotationDist');
    for(let v=5; v>=1; v--){ renderDistBar(rotDist, rotationVals.filter(x=>x===v).length, rotationVals.length, `${v}`, rotationEmojiMap[v]); }
    const workDist = document.getElementById('workloadDist');
    for(let v=5; v>=1; v--){ renderDistBar(workDist, workloadVals.filter(x=>x===v).length, workloadVals.length, `${v}`, workloadEmojiMap[v]); }
    const supDist = document.getElementById('supportedDist');
    for(let v=5; v>=1; v--){ renderDistBar(supDist, supportedVals.filter(x=>x===v).length, supportedVals.length, `${v}`, supportedEmojiMap[v]); }

    renderSparkline('sparkRotation', 'rotation', buckets.map(b => b.rotation), '#2a78d6');
    renderSparkline('sparkWorkload', 'workload', buckets.map(b => b.workload), '#eb6834');
    renderSparkline('sparkSupported', 'supported', buckets.map(b => b.supported), '#1baf7a');
    renderTrendChart(buckets);

    const highlightsList = document.getElementById('highlightsList');
    if(highlights.length === 0){
      highlightsList.innerHTML = `<div class="empty-state">No notes left yet.</div>`;
    }else{
      highlights.forEach(r => {
        const div = document.createElement('div');
        div.className = 'highlight-card';
        const date = new Date(r.ts);
        const dateStr = isNaN(date) ? '' : date.toLocaleDateString(undefined, { month:'short', day:'numeric' });
        const who = r.maName || r.email || '';
        div.innerHTML = `"${escapeHtml(r.highlight)}"<span class="highlight-meta">${dateStr}${who ? ' \u00b7 ' + escapeHtml(who) : ''}</span>`;
        highlightsList.appendChild(div);
      });
    }
  }

  /* ==================== EXPORT ==================== */
  function exportExcel(){
    if(!lastResponses || lastResponses.length === 0){
      alert('No responses to export in the current filter.');
      return;
    }
    if(typeof XLSX === 'undefined'){
      alert('Excel export library failed to load — check your connection and try again.');
      return;
    }

    const rows = lastResponses
      .slice()
      .sort((a,b) => new Date(a.ts) - new Date(b.ts))
      .map(r => ({
        ID: r.id || '',
        Timestamp: r.ts || '',
        Week: r.week || '',
        Email: r.email || '',
        Cohort: r.cohort || '',
        HRBP: r.hrbp || '',
        'Rotation (1-5)': typeof r.rotation === 'number' && !isNaN(r.rotation) ? r.rotation : '',
        'Workload (1-5)': typeof r.workload === 'number' && !isNaN(r.workload) ? r.workload : '',
        'Supported (1-5)': typeof r.supported === 'number' && !isNaN(r.supported) ? r.supported : '',
        Highlight: r.highlight || ''
      }));

    const rotationVals = lastResponses.map(r => r.rotation).filter(v => typeof v === 'number' && !isNaN(v));
    const workloadVals = lastResponses.map(r => r.workload).filter(v => typeof v === 'number' && !isNaN(v));
    const supportedVals = lastResponses.map(r => r.supported).filter(v => typeof v === 'number' && !isNaN(v));

    const summaryRows = [
      { Metric: 'Total responses', Value: lastResponses.length },
      { Metric: 'Rotation feeling \u2014 average (1-5)', Value: rotationVals.length ? Number(avg(rotationVals).toFixed(2)) : '' },
      { Metric: 'Workload manageability \u2014 average (1-5)', Value: workloadVals.length ? Number(avg(workloadVals).toFixed(2)) : '' },
      { Metric: 'Supported by RM/team \u2014 average (1-5)', Value: supportedVals.length ? Number(avg(supportedVals).toFixed(2)) : '' }
    ];

    const wb = XLSX.utils.book_new();
    const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
    const wsResponses = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');
    XLSX.utils.book_append_sheet(wb, wsResponses, 'Responses');

    const dateStr = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `gmap-pulse-responses-${dateStr}.xlsx`);
  }
</script>
</body>
</html>
