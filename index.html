<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMAP Pulse — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#FBF8F2; --surface:#FFFFFF; --ink:#26332C; --muted:#6B7A72;
    --accent:#3E7C6F; --accent-dark:#2C5C52; --warm:#EFA13B; --warm-soft:#FCEBD1;
    --line:#E7E1D3; --sky:#DCEAE5; --danger:#C1583F;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Karla',sans-serif; }
  .hidden{ display:none !important; }

  #adminView{ padding:28px 20px 60px; }
  .wrap{ max-width:960px; margin:0 auto; }
  .header{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .admin-title{ font-family:'Fredoka', sans-serif; font-weight:600; font-size:1.9rem; margin:0 0 6px; color:var(--ink); }
  .subtitle{ color:var(--muted); font-size:.95rem; margin:0; }
  .refresh-btn{
    background:var(--surface); border:1.5px solid var(--line); color:var(--ink); font-family:'Karla',sans-serif;
    font-weight:700; font-size:.88rem; padding:10px 16px; border-radius:12px; cursor:pointer;
    display:flex; align-items:center; gap:8px; transition:border-color .15s ease, transform .1s ease;
  }
  .refresh-btn:hover{ border-color:var(--accent); }
  .refresh-btn:active{ transform:scale(.97); }
  .refresh-btn.spinning .spin-icon{ animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .filter-bar select{
    font-family:'Karla',sans-serif; font-size:.88rem; padding:9px 14px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;
  }
  .filter-bar select:focus{ outline:none; border-color:var(--accent); }
  .unmatched-note{ font-size:.78rem; color:var(--muted); margin:0 0 18px; }

  .pulse-hero{
    background:var(--accent); color:#fff; border-radius:24px; padding:28px 30px; margin-bottom:22px;
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
    width:100%; box-sizing:border-box;
  }
  .pulse-left{ display:flex; align-items:center; gap:18px; }
  .pulse-emoji{ font-size:2.6rem; line-height:1; }
  .pulse-number{ font-family:'Fredoka',sans-serif; font-size:2.4rem; font-weight:600; line-height:1; }
  .pulse-label{ font-size:.85rem; opacity:.85; margin-top:4px; }
  .pulse-right{ text-align:right; }
  .response-count{ font-family:'Fredoka',sans-serif; font-size:1.5rem; font-weight:600; }
  .response-target{ font-size:.82rem; opacity:.85; }
  .target-track{ width:180px; height:6px; border-radius:999px; background:rgba(255,255,255,.3); margin-top:8px; overflow:hidden; }
  .target-fill{ height:100%; background:#fff; border-radius:999px; transition:width .5s ease; }

  .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:18px; width:100%; box-sizing:border-box; }
  @media (max-width:760px){ .grid-3{ grid-template-columns:1fr; } }

  .admin-card{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:22px; margin-bottom:18px; }
  .metric-card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; min-width:0; }
  .card-title{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.1rem; margin:0 0 4px; }
  .card-sub{ color:var(--muted); font-size:.85rem; margin:0 0 14px; }

  .avg-row{ display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .avg-number{ font-family:'Fredoka',sans-serif; font-size:1.9rem; font-weight:600; color:var(--accent); }
  .avg-out-of{ color:var(--muted); font-size:.8rem; }
  .delta-row{ display:flex; align-items:center; gap:5px; font-size:.8rem; font-weight:700; margin-bottom:10px; }
  .delta-up{ color:var(--accent); }
  .delta-down{ color:var(--danger); }
  .delta-flat{ color:var(--muted); }
  .sparkline-wrap{ position:relative; width:100%; height:44px; }
  .sparkline-wrap canvas{ width:100% !important; height:100% !important; display:block; max-width:100%; }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-label{ width:150px; flex-shrink:0; font-size:.85rem; color:var(--ink); font-weight:600; }
  .bar-track{ flex:1; height:12px; border-radius:999px; background:var(--sky); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; background:var(--accent); transition:width .5s ease; }
  .bar-count{ width:64px; text-align:right; flex-shrink:0; font-size:.8rem; color:var(--muted); font-weight:600; }

  .seg-bar{ display:flex; width:100%; height:30px; border-radius:10px; overflow:hidden; background:var(--line); }
  .seg{ display:flex; align-items:center; justify-content:center; font-size:.74rem; font-weight:700; color:#fff; white-space:nowrap; transition:width .5s ease; }
  .seg-low{ background:var(--danger); }
  .seg-mid{ background:var(--warm); }
  .seg-high{ background:var(--accent); }
  .seg-legend{ display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; font-size:.8rem; color:var(--muted); }
  .seg-legend-item{ display:flex; align-items:center; gap:6px; }
  .seg-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .seg-dot-low{ background:var(--danger); }
  .seg-dot-mid{ background:var(--warm); }
  .seg-dot-high{ background:var(--accent); }

  .highlights-list{ display:flex; flex-direction:column; gap:12px; max-height:520px; overflow-y:auto; }
  .past-highlights{ margin-top:16px; border-top:1px solid var(--line); padding-top:12px; }
  .past-highlights summary{
    cursor:pointer; font-size:.85rem; font-weight:700; color:var(--accent);
    list-style:none; display:inline-flex; align-items:center; gap:6px;
  }
  .past-highlights summary::-webkit-details-marker{ display:none; }
  .past-highlights summary::before{ content:'\25B8'; font-size:.75rem; transition:transform .15s ease; }
  .past-highlights[open] summary::before{ transform:rotate(90deg); }

  .ma-chip-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .ma-chip{
    flex:1; min-width:120px; border-radius:14px; padding:12px 16px; font-size:.85rem; font-weight:700;
    display:flex; align-items:center; gap:8px;
  }
  .ma-chip-num{ font-family:'Fredoka',sans-serif; font-size:1.4rem; font-weight:600; }
  .ma-chip-thriving{ background:var(--sky); color:var(--accent-dark); }
  .ma-chip-steady{ background:var(--warm-soft); color:#8a5a12; }
  .ma-chip-needs{ background:#FBE8E2; color:#9B3A22; }

  .ma-row-list{ display:flex; flex-direction:column; gap:8px; }
  .ma-row{ border:1px solid var(--line); border-radius:14px; padding:0; overflow:hidden; }
  .ma-row summary{
    list-style:none; cursor:pointer; padding:12px 14px; display:flex; align-items:center;
    gap:10px; flex-wrap:wrap; font-size:.85rem;
  }
  .ma-row summary::-webkit-details-marker{ display:none; }
  .ma-row-name{ font-weight:700; color:var(--ink); min-width:140px; }
  .ma-row-tag{ background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:.75rem; color:var(--muted); }
  .ma-badge{ border-radius:999px; padding:3px 12px; font-size:.75rem; font-weight:700; color:#fff; }
  .tier-thriving{ background:var(--accent); }
  .tier-steady{ background:var(--warm); }
  .tier-needs{ background:var(--danger); }
  .ma-trend{ font-size:.78rem; font-weight:700; }
  .trend-improving{ color:var(--accent); }
  .trend-declining{ color:var(--danger); }
  .trend-flat{ color:var(--muted); }
  .ma-row-week{ margin-left:auto; font-size:.75rem; color:var(--muted); }
  .ma-row-detail{ padding:0 14px 14px 14px; font-size:.82rem; color:var(--ink); border-top:1px solid var(--line); margin-top:0; padding-top:10px; }
  .highlight-card{ background:var(--warm-soft); border-radius:14px; padding:14px 16px; font-size:.92rem; line-height:1.5; color:var(--ink); }
  .highlight-meta{ display:block; margin-top:8px; font-size:.75rem; color:var(--muted); font-weight:600; }
  .empty-state{ color:var(--muted); font-size:.9rem; padding:20px 4px; text-align:center; }
  .loading{ text-align:center; padding:60px 0; color:var(--muted); }
  .error-banner{ background:#FBE8E2; color:#9B3A22; border-radius:14px; padding:14px 18px; font-size:.88rem; margin-bottom:18px; }

  .trend-legend{ display:flex; flex-wrap:wrap; gap:16px; margin-bottom:14px; font-size:.8rem; color:var(--muted); }
  .trend-legend span{ display:flex; align-items:center; gap:6px; }
  .trend-legend .dot{ width:10px; height:10px; border-radius:2px; display:inline-block; }

  .trend-table{ width:100%; border-collapse:collapse; font-size:.82rem; margin-top:18px; }
  .trend-table th, .trend-table td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  .trend-table th{ color:var(--muted); font-weight:700; font-size:.75rem; text-transform:uppercase; letter-spacing:.02em; }
  .trend-table td.num{ text-align:left; font-weight:600; }
</style>
</head>
<body>

<div id="adminView">
  <div class="wrap">
    <div class="header">
      <div>
        <h1 class="admin-title">GMAP Pulse — Insights</h1>
        <p class="subtitle">Live results from your team's check-in survey.</p>
        <p class="subtitle" style="font-size:.8rem; opacity:.75;">Snapshot data — refreshed periodically, not real-time.</p>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="refresh-btn" id="exportBtn" onclick="exportExcel()">
          <span>⬇️</span> Export Excel
        </button>
        <button class="refresh-btn" id="refreshBtn" onclick="loadAdminData()">
          <span class="spin-icon">🔄</span> Refresh
        </button>
      </div>
    </div>

    <div class="filter-bar">
      <select id="weekFilter" onchange="onFilterChange()"><option value="all">All weeks</option></select>
      <select id="cohortFilter" onchange="onFilterChange()"><option value="all">All cohorts</option></select>
      <select id="hrbpFilter" onchange="onFilterChange()"><option value="all">All HRBPs</option></select>
      <button class="refresh-btn" onclick="resetFilters()">Reset filters</button>
    </div>
    <p class="unmatched-note" id="unmatchedNote"></p>

    <div id="errorBanner"></div>
    <div id="adminContent">
      <div class="loading">Loading responses...</div>
    </div>
  </div>
</div>

<script>
  /* ==================== CONFIG ==================== */
  const CSV_URL = './data.csv';
  const ROSTER_URL = './roster.csv';

  const rotationLabels = { 1:'1: Struggling', 2:'2: Surviving', 3:'3: Maintaining', 4:'4: Progressing', 5:'5: Thriving' };
  const workloadLabels = { 1:'1: Overwhelmed', 2:'2: Heavy', 3:'3: Manageable', 4:'4: Comfortable', 5:'5: Very light' };
  const supportedLabels = { 1:'1: Unsupported', 2:'2: Somewhat unsupported', 3:'3: Neutral', 4:'4: Mostly supported', 5:'5: Fully supported' };
  // TARGET is computed dynamically from the roster (see getTargetCount()) —
  // no fixed number here, since roster size changes over time.

  let allResponses = [];
  let rosterIndex = { byEmail:{}, cohorts:[], hrbps:[] };
  let lastResponses = [];
  let emailHistory = {}; // built from full history — used for MA-status trend lookups
  let mainTrendChart = null;
  let sparklineCharts = { rotation:null, workload:null, supported:null };

  function scoreFromLabel(v){
    if(v === undefined || v === null) return NaN;
    const n = parseInt(String(v).trim(), 10);
    return isNaN(n) ? NaN : n;
  }

  function rowsToResponses(rows){
    if(!rows || rows.length < 2) return [];
    const headers = rows[0].map(h => (h || '').trim());
    const idx = (name) => headers.indexOf(name);

    const iTs = idx('Timestamp');
    const iEmail = idx('Email');
    const iRotation = idx('How are you feeling about your rotation this week?');
    const iWorkload = idx('How manageable has your workload felt this week?');
    const iSupported = idx('How supported have you felt by your Reporting Manager/team this week?');
    const iHighlight = idx('Is there anything you\u2019d like to flag to us this week?');
    const iId = idx('id (internal \u2014 do not use)');
    const iWeek = idx('week (internal)');

    return rows.slice(1)
      .filter(r => r.length > 0 && (iEmail === -1 || r[iEmail]))
      .map(r => ({
        id: iId > -1 ? r[iId] || '' : '',
        ts: iTs > -1 ? r[iTs] || '' : '',
        week: iWeek > -1 ? r[iWeek] || '' : '',
        email: iEmail > -1 ? (r[iEmail] || '').trim() : '',
        rotation: scoreFromLabel(iRotation > -1 ? r[iRotation] : ''),
        workload: scoreFromLabel(iWorkload > -1 ? r[iWorkload] : ''),
        supported: scoreFromLabel(iSupported > -1 ? r[iSupported] : ''),
        highlight: iHighlight > -1 ? r[iHighlight] || '' : ''
      }));
  }

  function buildRosterIndex(rows){
    if(!rows || rows.length < 2) return { byEmail:{}, cohorts:[], hrbps:[] };
    const headers = rows[0].map(h => (h || '').trim());
    const idx = (name) => headers.indexOf(name);
    const iCohort = idx('GMAP Cohort');
    const iName = idx('Name');
    const iEmail = idx('Email');
    const iHrbp = idx('HRBP');

    const byEmail = {};
    const cohortSet = new Set();
    const hrbpSet = new Set();

    rows.slice(1).forEach(r => {
      if(!r.length || iEmail === -1 || !r[iEmail]) return;
      const key = r[iEmail].trim().toLowerCase();
      const cohort = iCohort > -1 ? (r[iCohort] || '').trim() : '';
      const hrbp = iHrbp > -1 ? (r[iHrbp] || '').trim() : '';
      const name = iName > -1 ? (r[iName] || '').trim() : '';
      byEmail[key] = { cohort, hrbp, name };
      if(cohort) cohortSet.add(cohort);
      if(hrbp) hrbpSet.add(hrbp);
    });

    return {
      byEmail,
      cohorts: Array.from(cohortSet).sort(),
      hrbps: Array.from(hrbpSet).sort()
    };
  }

  function joinWithRoster(responses, index){
    return responses.map(r => {
      const key = (r.email || '').trim().toLowerCase();
      const match = index.byEmail[key];
      return {
        ...r,
        cohort: match ? match.cohort : null,
        hrbp: match ? match.hrbp : null,
        maName: match ? match.name : null,
        unmatched: !match
      };
    });
  }

  function joinWithRoster(responses, index){
    return responses.map(r => {
      const key = (r.email || '').trim().toLowerCase();
      const match = index.byEmail[key];
      return {
        ...r,
        cohort: match ? match.cohort : null,
        hrbp: match ? match.hrbp : null,
        maName: match ? match.name : null,
        unmatched: !match
      };
    });
  }

  /* ==================== MA STATUS TIERING ====================
     Step 1: base tier from the lower of Rotation (Q1) / Workload (Q2).
     Step 2 (checked in order, stop at first match):
       1. Workload = "Overwhelmed" (1) -> force "Needs support"
       2. Workload = "Heavy" (2) OR Supported = "Unsupported" (1) -> bump
          one tier WORSE (Thriving->Steady, Steady->Needs support)
       3. otherwise -> no change
  */
  const TIER_ORDER = ['Thriving', 'Steady', 'Needs support']; // best -> worst

  function computeTier(rotation, workload, supported){
    if(typeof rotation !== 'number' || isNaN(rotation) || typeof workload !== 'number' || isNaN(workload)) return null;
    const lowest = Math.min(rotation, workload);
    let idx = lowest >= 4 ? 0 : (lowest === 3 ? 1 : 2);

    if(workload === 1){
      idx = 2; // force Needs support
    }else if(workload === 2 || supported === 1){
      idx = Math.min(idx + 1, TIER_ORDER.length - 1); // bump toward worse
    }
    return TIER_ORDER[idx];
  }

  // Full-history map (ignores current filters) so trend comparisons always
  // have the true prior pulse available, even when a week filter is active.
  function buildEmailHistory(responses){
    const map = {};
    responses.forEach(r => {
      if(r.unmatched) return;
      const key = (r.email || '').trim().toLowerCase();
      if(!key) return;
      if(!map[key]) map[key] = [];
      map[key].push(r);
    });
    Object.keys(map).forEach(key => {
      map[key].sort((a,b) => (a.week||'').localeCompare(b.week||'') || (new Date(a.ts) - new Date(b.ts)));
      // Collapse duplicate submissions within the same week — keep the latest by timestamp.
      const deduped = [];
      map[key].forEach(r => {
        const last = deduped[deduped.length - 1];
        if(last && last.week === r.week){ deduped[deduped.length - 1] = r; }
        else{ deduped.push(r); }
      });
      map[key] = deduped;
    });
    return map;
  }

  // One row per MA: their most recent pulse within the CURRENT filter,
  // with a trend computed against their prior pulse from full history.
  function computeMaStatusRows(filteredResponses){
    const latestByEmail = {};
    filteredResponses.forEach(r => {
      if(r.unmatched) return;
      const key = (r.email || '').trim().toLowerCase();
      if(!key) return;
      const existing = latestByEmail[key];
      if(!existing || (r.week || '') > (existing.week || '')) latestByEmail[key] = r;
    });

    return Object.keys(latestByEmail).map(key => {
      const cur = latestByEmail[key];
      const curTier = computeTier(cur.rotation, cur.workload, cur.supported);
      const history = emailHistory[key] || [];
      const before = history.filter(h => (h.week || '') < (cur.week || ''));
      const prevEntry = before.length ? before[before.length - 1] : null;
      const prevTier = prevEntry ? computeTier(prevEntry.rotation, prevEntry.workload, prevEntry.supported) : null;

      let trend = 'new', trendLabel = 'New';
      if(prevTier && curTier){
        const curI = TIER_ORDER.indexOf(curTier), prevI = TIER_ORDER.indexOf(prevTier);
        if(curI < prevI){ trend = 'improving'; trendLabel = 'Improving'; }
        else if(curI > prevI){ trend = 'declining'; trendLabel = 'Declining'; }
        else{ trend = 'steady'; trendLabel = 'No change'; }
      }

      return {
        name: cur.maName || cur.email, cohort: cur.cohort || '\u2014', hrbp: cur.hrbp || '\u2014',
        tier: curTier, trend, trendLabel, week: cur.week,
        previousWeek: prevEntry ? prevEntry.week : null, previousTier: prevTier,
        rotation: cur.rotation, workload: cur.workload, supported: cur.supported,
        highlight: cur.highlight || ''
      };
    }).sort((a,b) => {
      const tierRank = { 'Needs support':0, 'Steady':1, 'Thriving':2 };
      const ra = tierRank[a.tier] ?? 3, rb = tierRank[b.tier] ?? 3;
      return ra - rb || a.name.localeCompare(b.name);
    });
  }

  let maHrbpFilterValue = 'all';
  let maCohortFilterValue = 'all';

  function onMaFilterChange(){
    maHrbpFilterValue = document.getElementById('maHrbpFilter').value;
    maCohortFilterValue = document.getElementById('maCohortFilter').value;
    renderAdmin(lastResponses);
  }

  function renderMaStatus(rows){
    const el = document.getElementById('maStatusContent');

    const hrbpOptions = rosterIndex.hrbps || [];
    const cohortOptions = rosterIndex.cohorts || [];
    const filterBarHtml = `
      <div class="filter-bar" style="margin:0 0 16px;">
        <select id="maHrbpFilter" onchange="onMaFilterChange()">
          <option value="all"${maHrbpFilterValue === 'all' ? ' selected' : ''}>All HRBPs</option>
          ${hrbpOptions.map(h => `<option value="${escapeHtml(h)}"${maHrbpFilterValue === h ? ' selected' : ''}>${escapeHtml(h)}</option>`).join('')}
        </select>
        <select id="maCohortFilter" onchange="onMaFilterChange()">
          <option value="all"${maCohortFilterValue === 'all' ? ' selected' : ''}>All cohorts</option>
          ${cohortOptions.map(c => `<option value="${escapeHtml(c)}"${maCohortFilterValue === c ? ' selected' : ''}>${escapeHtml(c)}</option>`).join('')}
        </select>
      </div>
    `;

    const filteredRows = rows.filter(r =>
      (maHrbpFilterValue === 'all' || r.hrbp === maHrbpFilterValue) &&
      (maCohortFilterValue === 'all' || r.cohort === maCohortFilterValue)
    );

    if(filteredRows.length === 0){
      el.innerHTML = filterBarHtml + '<div class="empty-state">No matched responses for this filter yet.</div>';
      return;
    }

    const counts = { Thriving:0, Steady:0, 'Needs support':0 };
    filteredRows.forEach(r => { if(r.tier && counts.hasOwnProperty(r.tier)) counts[r.tier]++; });

    const tierBadgeClass = { Thriving:'tier-thriving', Steady:'tier-steady', 'Needs support':'tier-needs' };
    const trendClass = { improving:'trend-improving', declining:'trend-declining', steady:'trend-flat', new:'trend-flat' };
    const trendSymbol = { improving:'\ud83d\udcc8', declining:'\ud83d\udcc9', steady:'\u2796', new:'\u2728' };

    el.innerHTML = filterBarHtml + `
      <div class="ma-chip-row">
        <div class="ma-chip ma-chip-thriving"><span class="ma-chip-num">${counts.Thriving}</span>Thriving</div>
        <div class="ma-chip ma-chip-steady"><span class="ma-chip-num">${counts.Steady}</span>Steady</div>
        <div class="ma-chip ma-chip-needs"><span class="ma-chip-num">${counts['Needs support']}</span>Needs support</div>
      </div>
      <div class="ma-row-list">
        ${filteredRows.map(r => `
          <details class="ma-row">
            <summary>
              <span class="ma-row-name">${escapeHtml(r.name)}</span>
              <span class="ma-badge ${tierBadgeClass[r.tier] || ''}">${escapeHtml(r.tier || 'Unknown')}</span>
              <span class="ma-row-tag">HRBP: ${escapeHtml(r.hrbp)}</span>
              <span class="ma-trend ${trendClass[r.trend]}">${trendSymbol[r.trend]} ${r.trendLabel}</span>
              <span class="ma-row-week">Latest pulse: ${escapeHtml(weekOptionLabel(r.week))}</span>
            </summary>
            <div class="ma-row-detail">

  function getFilteredResponses(){
    const week = document.getElementById('weekFilter').value;
    const cohort = document.getElementById('cohortFilter').value;
    const hrbp = document.getElementById('hrbpFilter').value;
    if(week === 'all' && cohort === 'all' && hrbp === 'all') return allResponses;
    return allResponses.filter(r => {
      if(r.unmatched) return false;
      if(week !== 'all' && r.week !== week) return false;
      if(cohort !== 'all' && r.cohort !== cohort) return false;
      if(hrbp !== 'all' && r.hrbp !== hrbp) return false;
      return true;
    });
  }

  // Expected response count = number of MAs in the roster matching the
  // current filter — so "of X expected" always reflects reality, not a
  // hardcoded guess. (Week filter doesn't narrow the roster itself.)
  function getTargetCount(){
    const cohort = document.getElementById('cohortFilter').value;
    const hrbp = document.getElementById('hrbpFilter').value;
    const entries = Object.values(rosterIndex.byEmail || {});
    if(cohort === 'all' && hrbp === 'all') return entries.length;
    return entries.filter(e => {
      if(cohort !== 'all' && e.cohort !== cohort) return false;
      if(hrbp !== 'all' && e.hrbp !== hrbp) return false;
      return true;
    }).length;

  function loadAdminData(){

    });

    Promise.all([parseCsv(CSV_URL), parseCsv(ROSTER_URL)])
      .then(([dataRows, rosterRows]) => {

        allResponses = joinWithRoster(responses, rosterIndex);
        emailHistory = buildEmailHistory(allResponses);
        populateFilterOptions(rosterIndex);

        const unmatchedCount = allResponses.filter(r => r.unmatched).length;

  }

  window.onload = loadAdminData;

  /* ==================== SHARED HELPERS ==================== */
  function avg(nums){ if(!nums.length) return 0; return nums.reduce((a,b)=>a+b,0) / nums.length; }
  function pulseEmojiFor(score){
    if(score >= 4.3) return '🤩'; if(score >= 3.5) return '🙂';
    if(score >= 2.5) return '😐'; if(score >= 1.5) return '😕'; return '😖';
  }
  function renderSegmentedBar(containerEl, values, labels){
    const total = values.length;
    if(total === 0){
      containerEl.innerHTML = `<div class="empty-state">No responses yet.</div>`;
      return;
    }
    const lowCount = values.filter(v => v <= 2).length;
    const midCount = values.filter(v => v === 3).length;
    const highCount = values.filter(v => v >= 4).length;
    const pctLow = Math.round((lowCount/total)*100);
    const pctMid = Math.round((midCount/total)*100);
    const pctHigh = 100 - pctLow - pctMid; // avoid rounding gaps not summing to 100

    const showLabel = (pct) => pct >= 10 ? `${pct}%` : '';

    containerEl.innerHTML = `
      <div class="seg-bar">
        <div class="seg seg-low" style="width:${pctLow}%">${showLabel(pctLow)}</div>
        <div class="seg seg-mid" style="width:${pctMid}%">${showLabel(pctMid)}</div>
        <div class="seg seg-high" style="width:${pctHigh}%">${showLabel(pctHigh)}</div>
      </div>
      <div class="seg-legend">
        <span class="seg-legend-item"><span class="seg-dot seg-dot-low"></span>${labels.low} \u00b7 ${lowCount} \u00b7 ${pctLow}%</span>
        <span class="seg-legend-item"><span class="seg-dot seg-dot-mid"></span>${labels.mid} \u00b7 ${midCount} \u00b7 ${pctMid}%</span>
        <span class="seg-legend-item"><span class="seg-dot seg-dot-high"></span>${labels.high} \u00b7 ${highCount} \u00b7 ${pctHigh}%</span>
      </div>
    `;
  }
  function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str == null ? '' : str; return d.innerHTML; }

  // Monday of a given ISO week label like "2026-W37"
  function isoWeekToMonday(weekLabel){
    const m = /^(\d{4})-W(\d{1,2})$/.exec(weekLabel || '');
    if(!m) return null;
    const year = parseInt(m[1], 10), wk = parseInt(m[2], 10);
    const jan4 = new Date(Date.UTC(year, 0, 4));
    const jan4Day = jan4.getUTCDay() || 7;
    const week1Monday = new Date(jan4);
    week1Monday.setUTCDate(jan4.getUTCDate() - jan4Day + 1);
    const monday = new Date(week1Monday);
    monday.setUTCDate(week1Monday.getUTCDate() + (wk - 1) * 7);
    return monday;
  }

  function computeWeeklyBuckets(responses){
    const byWeek = {};
    responses.forEach(r => {
      const wk = r.week || 'Unlabeled';
      if(!byWeek[wk]) byWeek[wk] = { rotation:[], workload:[], supported:[], count:0 };
      if(typeof r.rotation === 'number' && !isNaN(r.rotation)) byWeek[wk].rotation.push(r.rotation);
      if(typeof r.workload === 'number' && !isNaN(r.workload)) byWeek[wk].workload.push(r.workload);
      if(typeof r.supported === 'number' && !isNaN(r.supported)) byWeek[wk].supported.push(r.supported);
      byWeek[wk].count++;
    });
    const weekKeys = Object.keys(byWeek).sort();
    return weekKeys.map(wk => {
      const b = byWeek[wk];
      const monday = isoWeekToMonday(wk);
      const label = monday
        ? 'Week of ' + monday.toLocaleDateString(undefined, { month:'short', day:'numeric' })
        : wk;
      return {
        week: wk, label,
        rotation: avg(b.rotation), workload: avg(b.workload), supported: avg(b.supported),
        count: b.count
      };
    });
  }

  function deltaHtml(current, previous, unit){
    if(previous === undefined || previous === null || isNaN(previous)){
      return `<span class="delta-flat">\u2014</span>`;
    }
    const d = current - previous;
    const rounded = Math.round(d * 10) / 10;
    if(Math.abs(rounded) < 0.05){
      return `<span class="delta-flat">0.0 ${unit}</span>`;
    }
    const cls = rounded > 0 ? 'delta-up' : 'delta-down';
    const sign = rounded > 0 ? '+' : '';
    const arrow = rounded > 0 ? '\u2191' : '\u2193';
    return `<span class="${cls}">${arrow} ${sign}${rounded.toFixed(1)} ${unit}</span>`;
  }

  function heroDeltaHtml(current, previous, unit){
    if(current === null || current === undefined || isNaN(current)) return '';
    if(previous === null || previous === undefined || isNaN(previous)){
      return `<span style="font-size:.9rem; font-weight:400; opacity:.75; margin-left:8px;">(no prior week)</span>`;
    }
    const d = Math.round((current - previous) * 10) / 10;
    if(Math.abs(d) < 0.05){
      return `<span style="font-size:.9rem; font-weight:400; opacity:.85; margin-left:8px;">(0.0 ${unit} vs last week)</span>`;
    }
    const sign = d > 0 ? '+' : '';
    const arrow = d > 0 ? '\u2191' : '\u2193';
    return `<span style="font-size:.9rem; font-weight:700; opacity:.95; margin-left:8px;">(${arrow} ${sign}${d.toFixed(1)} ${unit} vs last week)</span>`;
  }

  /* ==================== MAIN RENDER ==================== */
  function renderAdmin(responses){
    const content = document.getElementById('adminContent');
    const total = responses.length;

    if(total === 0){
      content.innerHTML = `<div class="admin-card"><div class="empty-state">No responses match this filter yet.</div></div>`;
      return;
    }

    const rotationVals = responses.map(r => r.rotation).filter(v => typeof v === 'number' && !isNaN(v));
    const workloadVals = responses.map(r => r.workload).filter(v => typeof v === 'number' && !isNaN(v));
    const supportedVals = responses.map(r => r.supported).filter(v => typeof v === 'number' && !isNaN(v));
    const rotationAvg = avg(rotationVals);
    const workloadAvg = avg(workloadVals);
    const supportedAvg = avg(supportedVals);
    const overallAvg = avg([rotationAvg, workloadAvg, supportedAvg]);

    const buckets = computeWeeklyBuckets(responses);
    const current = buckets[buckets.length - 1];
    const previous = buckets.length > 1 ? buckets[buckets.length - 2] : null;
    const currentWeekTotal = current ? current.count : 0;
    const currentWeekOverall = current ? avg([current.rotation, current.workload, current.supported]) : null;
    const previousWeekOverall = previous ? avg([previous.rotation, previous.workload, previous.supported]) : null;

    const highlights = responses
      .filter(r => r.highlight && r.highlight.trim().length > 0)
      .sort((a,b) => new Date(b.ts) - new Date(a.ts));
    const currentWeekHighlights = current ? highlights.filter(h => h.week === current.week) : [];

  /* ==================== EXPORT ==================== */
  function exportExcel(){
    if(!lastResponses || lastResponses.length === 0){
      alert('No responses to export in the current filter.');
      return;
    }
    if(typeof XLSX === 'undefined'){
      alert('Excel export library failed to load — check your connection and try again.');
      return;
    }

    const rows = lastResponses
      .slice()
      .sort((a,b) => new Date(a.ts) - new Date(b.ts))
      .map(r => ({
        ID: r.id || '',
        Timestamp: r.ts || '',
        Week: r.week || '',
        Email: r.email || '',
        Cohort: r.cohort || '',
        HRBP: r.hrbp || '',
        'Rotation (1-5)': typeof r.rotation === 'number' && !isNaN(r.rotation) ? r.rotation : '',
        'Workload (1-5)': typeof r.workload === 'number' && !isNaN(r.workload) ? r.workload : '',
        'Supported (1-5)': typeof r.supported === 'number' && !isNaN(r.supported) ? r.supported : '',
        Highlight: r.highlight || ''
      }));

    const rotationVals = lastResponses.map(r => r.rotation).filter(v => typeof v === 'number' && !isNaN(v));
    const workloadVals = lastResponses.map(r => r.workload).filter(v => typeof v === 'number' && !isNaN(v));
    const supportedVals = lastResponses.map(r => r.supported).filter(v => typeof v === 'number' && !isNaN(v));

    const summaryRows = [
      { Metric: 'Total responses', Value: lastResponses.length },
      { Metric: 'Rotation feeling \u2014 average (1-5)', Value: rotationVals.length ? Number(avg(rotationVals).toFixed(2)) : '' },
      { Metric: 'Workload manageability \u2014 average (1-5)', Value: workloadVals.length ? Number(avg(workloadVals).toFixed(2)) : '' },
      { Metric: 'Supported by RM/team \u2014 average (1-5)', Value: supportedVals.length ? Number(avg(supportedVals).toFixed(2)) : '' }
    ];

    const wb = XLSX.utils.book_new();
    const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
    const wsResponses = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');
    XLSX.utils.book_append_sheet(wb, wsResponses, 'Responses');

    const dateStr = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `gmap-pulse-responses-${dateStr}.xlsx`);
  }
</script>
</body>
</html>
